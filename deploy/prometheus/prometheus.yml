# Prometheus: App Metrics → Prometheus → Alertmanager (xem readme: Hệ thống logs)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Gửi alert tới Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # App chạy trên host: expose /metrics (vd. port 9091)
  - job_name: "app"
    static_configs:
      - targets: ["host.docker.internal:9091"]
    metrics_path: /metrics
    scrape_interval: 10s
