# Mô hình: App → Metrics → Prometheus → Alertmanager
#          App → Logs → Promtail → Loki → Grafana
# Chạy từ thư mục gốc project (fiber-template):
#   docker compose -f deploy/docker-compose.logging.yml up -d
#
# App: ghi log ra ./storage/logs/app.log; expose /metrics (vd. port 9091).

services:
  # --- Metrics: Prometheus → Alertmanager ---
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    restart: unless-stopped

  # --- Logs: Promtail → Loki ---
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Thư mục log app: từ deploy/ lên project root rồi storage/logs
      - ../storage/logs:/var/log/fiber:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3040:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
      # Postgres (cùng instance với app, database tên grafana); host.docker.internal = máy host
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: host.docker.internal
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: ${DB_USER:-app_user}
      GF_DATABASE_PASSWORD: ${DB_PASSWORD:-strong_password}
      GF_DATABASE_PORT: ${DB_PORT:-5432}
      GF_DATABASE_SSL_MODE: disable
    extra_hosts:
      # Linux: cần dòng này để container resolve host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
